{% extends 'base.html' %}
{% load static %}

{% block title %}Tags - AskPupkin{% endblock %}

{% block content %}
<div class="tags-section">
    <div class="tags-header">
        <h1>Popular Tags</h1>
    </div>
    
    <div class="tags-list">
        {% for tag in tags_list %}
        <a href="{% url 'tag' tag_name=tag.name %}" class="tag tag-large">{{ tag.name }}</a>
        {% endfor %}
    </div>
</div>
{% endblock %}
