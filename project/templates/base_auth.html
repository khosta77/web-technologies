<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AskPupkin{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="{% url 'index' %}" class="logo-link">
                        <img src="{% static 'img/logo.png' %}" alt="AskPupkin" class="logo-img">
                        <span class="logo-text">AskPupkin</span>
                    </a>
                </div>
                
                <div class="search-field">
                    <div class="search-input-container">
                        <img src="{% static 'img/search.jpg' %}" alt="Search" class="search-icon">
                        <input type="text" placeholder="Поиск..." class="search-input-field" id="searchInputField">
                    </div>
                </div>
                
                <div class="user-block">
                    <img src="{% static 'img/search.jpg' %}" alt="Search" class="search-toggle-icon">
                    
                    <div class="auth-links">
                        {% block login_button %}
                        <a href="{% url 'login' %}" class="btn btn-outline">Войти</a>
                        {% endblock %}
                        {% block signup_button %}
                        <a href="{% url 'signup' %}" class="btn btn-primary">Регистрация</a>
                        {% endblock %}
                    </div>
                    
                    <div class="user-info" style="display: none;">
                        <img src="{% static 'img/avatar.jpg' %}" alt="Avatar" class="user-avatar">
                        <span class="user-name">Dr. Pepper</span>
                        <div class="user-menu">
                            <a href="{% url 'settings' %}">settings</a>
                            <a href="{% url 'index' %}">log out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Всплывающий виджет поиска -->
        <div class="search-widget" id="searchWidget">
            <div class="search-widget-content">
                <div class="search-input-container">
                    <img src="{% static 'img/search.jpg' %}" alt="Search" class="search-widget-icon">
                    <input type="text" placeholder="Поиск..." class="search-input" id="searchInput">
                </div>
                <button class="search-close-btn" id="searchClose">×</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="auth-wrapper">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 AskPupkin. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="{% static 'js/search.js' %}"></script>
</body>
</html>
