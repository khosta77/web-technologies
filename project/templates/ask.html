{% extends 'base.html' %}
{% load static %}

{% block title %}New Question - AskPupkin{% endblock %}

{% block content %}
<div class="ask-page">
    <h1>New Question</h1>
    
    <div class="error-messages">
        <div class="alert alert-error">
            Sorry, wrong password!
        </div>
    </div>
    
    <form method="post" class="ask-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="How to build a moon park ?" class="form-control" maxlength="200" required>
        </div>
        
        <div class="form-group">
            <label for="text">Text</label>
            <textarea id="text" name="text" class="form-control" rows="10" required>Really, how ?
Have no idea about it</textarea>
        </div>
        
        <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" name="tags" value="moon, park, puzzle" class="form-control" maxlength="100" placeholder="Enter tags separated by commas">
        </div>
        
        <button type="submit" class="btn btn-primary">ASK!</button>
    </form>
</div>
{% endblock %}
