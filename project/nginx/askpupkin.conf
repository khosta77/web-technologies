# Конфигурация Nginx для проекта AskPupkin
# Размер: 72 строки

events {
    worker_connections 1024;
}

http {
    # Включаем MIME типы для правильного Content-Type
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    
    upstream gunicorn_backend {
        server 127.0.0.1:8000;
    }

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=askpupkin_cache:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;
        
        # Максимальный размер загружаемого файла (для фото)
        client_max_body_size 10M;

        # Сжатие
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;

        # /uploads/ - приоритетнее статики
        location /uploads/ {
            alias /Users/stepanfilimonov/C++/web/web-technologies/project/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Статические файлы из /static/
        location /static/ {
            root /Users/stepanfilimonov/C++/web/web-technologies/project;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Pragma "no-cache";
            autoindex off;
        }

        # AJAX endpoints - без кэширования
        location /api/ {
            proxy_pass http://gunicorn_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_path / /;
            proxy_cache off;
        }

        # Проксирование на gunicorn с кэшированием
        location / {
            proxy_pass http://gunicorn_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_path / /;
            proxy_cache_methods GET HEAD;
            proxy_cache askpupkin_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            # Не кэшируем ответы с Set-Cookie, чтобы CSRF токены всегда передавались
            proxy_ignore_headers Set-Cookie;
            proxy_cache_bypass $http_cookie;
        }
    }
}
