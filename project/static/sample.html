<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML для проверки статики</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .info {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .success {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Статический файл успешно загружен!</h1>
        <div class="info">
            <p><strong>Файл:</strong> sample.html</p>
            <p><strong>Путь:</strong> /static/sample.html</p>
            <p><strong>Статус:</strong> <span class="success">Nginx отдает статику корректно</span></p>
        </div>
        <div class="info">
            <p>Этот файл используется для проверки настройки Nginx для отдачи статических файлов.</p>
            <p>Если вы видите эту страницу, значит конфигурация работает правильно!</p>
        </div>
    </div>
</body>
</html>
