[tool.poetry]
name = "askpupkin"
version = "0.1.0"
description = "Stack Overflow-like Q&A platform"
authors = ["Stepan Filimonov"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
django = "5.2.7"
pytest = "8.4.2"
pytest-django = "4.11.1"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "askpupkin.settings"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

